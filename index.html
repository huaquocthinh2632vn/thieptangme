<script>
function openLetter() {
  const letter = document.getElementById("letter");
  const button = document.getElementById("openButton");

  if (!letter || !button) return;

  letter.classList.add("show");
  button.textContent = "♡ Py yêu mẹ nhiều lắm ♡";
  button.disabled = true;

  for (let i = 0; i < 28; i++) {
    setTimeout(() => {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = ["♡", "♥", "🌷", "💕"][
        Math.floor(Math.random() * 4)
      ];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 16 + Math.random() * 20 + "px";
      heart.style.color = "#d96f8c";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }, i * 90);
  }
}

// Cánh hoa rơi
function createPetal() {
  const petal = document.createElement("span");
  petal.className = "petal";
  petal.textContent = Math.random() > 0.5 ? "🌸" : "✿";
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.fontSize = 10 + Math.random() * 12 + "px";
  petal.style.opacity = 0.3 + Math.random() * 0.5;
  petal.style.animationDuration = 7 + Math.random() * 8 + "s";

  document.body.appendChild(petal);
  petal.addEventListener("animationend", () => petal.remove());
}

for (let i = 0; i < 12; i++) {
  setTimeout(createPetal, i * 600);
}
setInterval(createPetal, 1800);

// Nhạc piano tạo bằng Web Audio API
let audio = null;
let playing = false;
let timer = null;
let index = 0;

const melody = [
  [523.25, 0.5], [659.25, 0.5], [783.99, 1],
  [659.25, 0.5], [587.33, 0.5], [659.25, 1],
  [523.25, 1], [392.00, 1], [440.00, 0.5],
  [523.25, 0.5], [587.33, 1], [523.25, 0.5],
  [440.00, 0.5], [392.00, 1], [349.23, 1]
];

function playNote(freq, duration, volume = 0.07) {
  if (!audio || !playing) return;

  const now = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + 0.04);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + Math.max(0.08, duration * 0.85)
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

function nextNote() {
  if (!playing) return;

  const [frequency, duration] = melody[index];

  playNote(frequency, duration);
  if (index % 4 === 0) {
    playNote(frequency / 2, duration * 1.2, 0.025);
  }

  index = (index + 1) % melody.length;
  timer = setTimeout(nextNote, duration * 850);
}

async function toggleMusic() {
  const button = document.getElementById("musicButton");

  try {
    if (!audio) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        button.textContent = "Trình duyệt không hỗ trợ nhạc";
        return;
      }

      audio = new AudioContextClass();
    }

    if (!playing) {
      await audio.resume();
      playing = true;
      button.textContent = "♫ Tắt nhạc piano";
      nextNote();
    } else {
      playing = false;
      clearTimeout(timer);
      button.textContent = "♫ Bật nhạc piano";
    }
  } catch (error) {
    playing = false;
    button.textContent = "Không phát được nhạc - thử lại";
    console.error("Lỗi phát nhạc:", error);
  }
}
</script>
